<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Laboration 4</title>
</head>

<body>
    <main>
        <header>
            <h1>RandomStuff</h1>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">Hem</a></li>
                    <li><a href="admin.html">Admin</a></li>
                    <li><a href="login.html">Logga in</a></li>
                </ul>
            </nav>
        </header>
        <section class="firstPage">
            <h2>Logga in eller registrera dig</h2>
            <section class="userAction">
                <h3>Logga in</h3>

                <form method="post" class="loginForm">
                    <div class="login-felmeddelanden"></div>
                    <div class="inputs">
                        <label for="username">Användarnamn:</label>
                        <input id="loginUsername" type="text">
                    </div>

                    <div class="inputs">
                        <label for="password">Lösenord:</label>
                        <input id="loginPassword" type="password">
                    </div>
                    <button class="submitBtn" type="submit">Logga in</button>
                </form>

            </section>
            <section class="userAction">
                <h3>Registrera dig</h3>

                <form method="post" class="registerForm">
                    <div class="register-felmeddelanden"></div>
                    <div class="inputs">
                        <label for="username">Användarnamn:</label>
                        <input required id="registerUsername" type="text">
                    </div>

                    <div class="inputs">
                        <label for="password">Lösenord:</label>
                        <input required id="registerPassword" type="password">
                    </div>
                    <button class="submitBtn" type="submit">Registrera dig</button>
                </form>

            </section>
        </section>
        <footer>
            <p>Laboration 4 | Backendbaserad webbutveckling</p>
            <p>Riina Aaltonen</p>
            <p>Mittuniversitet 2026</p>
        </footer>
    </main>
    <script src="main.js"></script>
</body>

</html>
