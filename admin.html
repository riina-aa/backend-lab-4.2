<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="checkAuth.js"></script>
    <title>Laboration 4</title>
</head>

<body>
    <main>
        <header>
            <h1>RandomStuff</h1>
            <nav>
                <ul class="menu">
                    <li><a href="index.html">Hem</a></li>
                    <li class="current"><a href="admin.html">Admin</a></li>
                    <li><a href="login.html">Logga in</a></li>
                </ul>
            </nav>
        </header>
        <section class="firstPage">
            <h2>Välkommen!</h2>
            <div class="dashboard">
                <p>Du är inloggad som <strong>admin</strong></p>
                <p>Här kan du lägga till och ta bort produkter på den här webbplatsen.</p>
            </div>
            <section class="add">
                <h3>Lägg till produkter</h3>
                <form id="productForm">
                    <div class="produkt-meddelanden"></div>
                    <div class="inputs">
                        <label for="productName">Produktnamn:</label>
                        <input type="text" name="productName" id="productName">
                    </div>
                    <div class="inputs">
                        <label for="beskrivning">Beskrivning:</label>
                        <textarea rows="2" name="description" id="beskrivning"></textarea>
                    </div>
                    <div class="inputs">
                        <label for="produktPris">Produktpris:</label>
                        <input type="text" name="productPrice" id="produktPris">
                    </div>
                    <div class="buttons">
                        <button class="submitBtn" type="submit">Lägg till produkt</button>
                        <button class="submitBtn" type="reset">Rensa formulär</button>
                    </div>
                </form>
            </section>
            <section class="delete">
                <h3>Radera produkter</h3>
                <div class="delete-list"></div>
            </section>
        </section>
        <footer>
            <p>Laboration 4 | Backendbaserad webbutveckling</p>
            <p>Riina Aaltonen</p>
            <p>Mittuniversitet 2026</p>
        </footer>
    </main>
    <script src="main.js"></script>
</body>

</html>
